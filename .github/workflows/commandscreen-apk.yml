name: Build Command Screen APK

on:
  pull_request:
    paths:
      - 'commandscreen-build/**'
      - '.github/workflows/commandscreen-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: commandscreen-build
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CommandScreenV2-debug-apk
          path: commandscreen-build/app/build/outputs/apk/debug/app-debug.apk
